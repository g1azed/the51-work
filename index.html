<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🌊 더피프티원엑스 업무관리</title>
<style>
:root{
  --bg:#f5f7fa; --panel:#ffffff; --line:#e3e8ee; --text:#1f2933; --muted:#6b7a8a;
  --accent:#4a7fa5; --accent-soft:#e6eff6; --accent-ink:#2f5d80;
  --red:#d9534f; --red-soft:#fbe9e8; --orange:#e08a2e; --orange-soft:#fdf0e0;
  --yellow:#c9a227; --yellow-soft:#fbf5dc; --green:#3f9a5f; --green-soft:#e4f3e9;
  --gray:#8a94a0; --gray-soft:#eef0f3; --brown:#9a6b4c; --brown-soft:#f3ebe5;
  --blue:#3b82c4; --blue-soft:#e4eefb; --purple:#7c5cc4; --purple-soft:#ede8f8;
  --radius:12px; --shadow:0 1px 2px rgba(20,40,60,.06),0 4px 14px rgba(20,40,60,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-ink)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#dfeaf3,#f5f7fa);border-bottom:1px solid var(--line)}
.top-in{max-width:1400px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.2px}
.top h1 small{font-weight:400;color:var(--muted);font-size:13px;margin-left:10px}
.top .spacer{flex:1}
.top nav{display:flex;gap:4px}
.top nav button{border:0;background:transparent;padding:6px 12px;border-radius:8px;color:var(--muted);font-weight:600}
.top nav button.on{background:#fff;color:var(--accent-ink);box-shadow:var(--shadow)}
.tools{display:flex;gap:6px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-weight:600;color:var(--text);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:#f3f6f9}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink)}
.btn.danger{color:var(--red)}
.btn.sm{padding:3px 8px;font-size:12px;border-radius:6px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--gray-soft);color:var(--text)}

main{max-width:1400px;margin:0 auto;padding:20px 24px 80px}
.overlay{position:fixed;inset:0;background:rgba(20,30,40,0);display:none;z-index:40;pointer-events:none}
.overlay.on{background:rgba(20,30,40,.5);display:block}
.view{display:none}.view.on{display:block}

/* dashboard grid */
.grid{display:grid;grid-template-columns:minmax(260px,1fr) minmax(0,2.6fr) minmax(260px,1fr);gap:18px;align-items:start}
@media (max-width:1100px){.grid{grid-template-columns:1fr 1fr}.grid>.col-projects{grid-column:1/-1;order:-1}}
@media (max-width:700px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.panel-h h2{margin:0;font-size:14px;font-weight:700;color:var(--accent-ink);letter-spacing:.2px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.panel-h h2::before{content:"🌊 ";}
.panel-h .cnt{font-size:12px;color:var(--muted);font-weight:500}
.panel-h .spacer{flex:1}
.panel-b{padding:10px 12px}
.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:13px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;line-height:18px;white-space:nowrap}
.chip.s-대기{background:var(--red-soft);color:var(--red)} .chip.s-보류{background:var(--gray-soft);color:var(--gray)}
.chip.s-진행{background:var(--orange-soft);color:var(--orange)} .chip.s-검토{background:var(--yellow-soft);color:#8a6f10}
.chip.s-완료{background:var(--green-soft);color:var(--green)} .chip.s-취소{background:var(--brown-soft);color:var(--brown)}
.chip.s-없음{background:var(--gray-soft);color:var(--muted)}
.chip.t-중요{background:var(--red-soft);color:var(--red)} .chip.t-긴급{background:var(--green-soft);color:var(--green)}
.chip.rel{background:var(--blue-soft);color:var(--blue)}
.chip.designer{background:var(--purple-soft);color:var(--purple)}
.chip.rms{background:var(--blue-soft);color:var(--blue);text-decoration:none;cursor:pointer}
.chip.rms:hover{filter:brightness(.95)}
.chip.due{background:var(--gray-soft);color:var(--muted);font-weight:500}
.chip.due.today{background:var(--accent-soft);color:var(--accent-ink)} .chip.due.over{background:var(--red-soft);color:var(--red)}
.chip.dow{background:var(--purple-soft);color:var(--purple)}

/* todo list */
.todo{display:flex;gap:10px;padding:9px 6px;border-bottom:1px dashed var(--line);align-items:flex-start}
.todo:last-child{border-bottom:0}
.todo .chk{margin-top:3px;width:16px;height:16px;flex:none;accent-color:var(--accent)}
.todo .body{flex:1;min-width:0}
.todo .name{font-weight:600;white-space:pre-wrap;word-break:break-word;cursor:pointer}
.todo.done .name{text-decoration:line-through;color:var(--muted);font-weight:500}
.todo .meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.todo .act{opacity:0;transition:.15s}
.todo:hover .act,.todo:focus-within .act{opacity:1}
.filterbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:#fafbfc}
.filterbar select,.filterbar input{border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:#fff;font-size:12.5px}
.filterbar label{font-size:12px;color:var(--muted);display:inline-flex;gap:4px;align-items:center}

/* project cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff;display:flex;flex-direction:column;gap:8px;position:relative;transition:.15s}
.card:hover{border-color:#c9d6e2;box-shadow:var(--shadow)}
.card.st-완료,.card.st-취소{opacity:.7}
.card .title{font-weight:700;font-size:14px;cursor:pointer;word-break:break-word}
.card .row{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.card .memo{color:var(--muted);font-size:12.5px;white-space:pre-wrap}
.card .act{position:absolute;top:8px;right:8px;opacity:0;display:flex;gap:2px}
.card:hover .act,.card:focus-within .act{opacity:1}
.bar{height:6px;background:var(--gray-soft);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7fb2d6,var(--accent));border-radius:4px}
.pct{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.sub{margin-top:2px;border-top:1px dashed var(--line);padding-top:6px}
.sub .todo{padding:4px 0;font-size:12.5px}
.sub .todo .name{font-weight:500}

/* notes */
.note{border:1px solid var(--line);border-left:4px solid #9dc1dc;border-radius:8px;padding:10px 12px;margin-bottom:10px;background:#fbfdff;position:relative}
.note h3{margin:0 0 4px;font-size:13px;display:flex;align-items:center;gap:6px}
.note h3::before{content:"💙";font-size:12px}
.note pre{margin:0;white-space:pre-wrap;word-break:break-word;font:inherit;font-size:12.5px;color:#3a4652}
.note .act{position:absolute;top:6px;right:6px;opacity:0;display:flex}
.note:hover .act,.note:focus-within .act{opacity:1}

/* journal */
.journal-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.journal-h h2{margin:0;font-size:16px;color:var(--accent-ink)}
.journal-h h2::before{content:"🌊 "}
.month{margin-bottom:10px}
.month>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);font-weight:700;box-shadow:var(--shadow)}
.month>summary::-webkit-details-marker{display:none}
.month>summary::before{content:"▸";color:var(--muted);transition:.15s;display:inline-block}
.month[open]>summary::before{transform:rotate(90deg)}
.month>summary .cnt{font-weight:500;color:var(--muted);font-size:12px}
.month>summary .spacer{flex:1}
.month .tbl{background:var(--panel);border:1px solid var(--line);border-top:0;border-radius:0 0 var(--radius) var(--radius);overflow-x:auto}
.month[open]>summary{border-radius:var(--radius) var(--radius) 0 0}
table.j{width:100%;border-collapse:collapse;min-width:720px}
table.j th{font-size:12px;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:600;background:#fafbfc}
table.j td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.j tr:last-child td{border-bottom:0}
table.j tr.today td{background:#f3f8fc}
table.j tr.off td{background:#fafafa;color:var(--muted)}
table.j .d{white-space:nowrap;font-weight:600;width:110px}
table.j .d small{display:block;color:var(--muted);font-weight:500;font-size:11.5px}
table.j .log,table.j .memo{white-space:pre-wrap;word-break:break-word;min-width:220px;cursor:text}
table.j .memo{color:#5a6674;width:28%}
table.j .log:empty::before,table.j .memo:empty::before{content:"클릭하여 입력";color:#b8c2cc;font-size:12px}
table.j .log:focus,table.j .memo:focus{outline:2px solid var(--accent);outline-offset:-2px;background:#fff;border-radius:4px}
table.j .log .tk{color:var(--accent-ink);font-weight:600}
table.j .log .arrow{color:var(--green);font-weight:600}
table.j .ops{width:64px;white-space:nowrap;text-align:right}
table.j .ops .btn{opacity:0}
table.j tr:hover .ops .btn{opacity:1}
.month-foot{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--line);background:#fafbfc;align-items:center}

/* calendar & list */
.cal-h{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.cal-h h2{margin:0;font-size:16px;color:var(--accent-ink);min-width:120px;text-align:center}
.cal-h h2::before{content:"◽"}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:5px 12px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff}
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.calendar{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:max-content}
.cal-grid .dh{padding:8px 0;text-align:center;font-size:12px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);background:#fafbfc}
.cal-grid .dh:first-child{color:var(--red)} .cal-grid .dh:nth-child(7){color:var(--blue)}
.cell{min-height:80px;min-width:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 5px;position:relative;cursor:pointer;transition:.12s}
.cell:nth-child(7n){border-right:0}
.cell:hover{background:#f6f9fc}
.cell.other{background:#fafafa;color:#b8c2cc}
.cell.today .dn{background:var(--accent);color:#fff}
.cell .dn{display:inline-flex;width:22px;height:22px;align-items:center;justify-content:center;border-radius:50%;font-size:12px;font-weight:600;margin-bottom:3px}
.cell.sun .dn{color:var(--red)} .cell.sat .dn{color:var(--blue)}
.cell.today.sun .dn,.cell.today.sat .dn{color:#fff}
.cell .ev{display:block;font-size:11.5px;line-height:17px;padding:1px 6px;border-radius:4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--accent-soft);color:var(--accent-ink);border-left:3px solid var(--accent);cursor:pointer}
.cell .ev:hover{filter:brightness(.95)}
.cell .ev.done{opacity:.55;text-decoration:line-through}
.cell .ev.off{background:var(--gray-soft);color:var(--muted);border-left-color:var(--gray)}
.cell .ev.c-red{background:var(--red-soft);color:var(--red);border-left-color:var(--red)}
.cell .ev.c-orange{background:var(--orange-soft);color:var(--orange);border-left-color:var(--orange)}
.cell .ev.c-yellow{background:var(--yellow-soft);color:#8a6f10;border-left-color:var(--yellow)}
.cell .ev.c-green{background:var(--green-soft);color:var(--green);border-left-color:var(--green)}
.cell .ev.c-purple{background:var(--purple-soft);color:var(--purple);border-left-color:var(--purple)}
.cell .ev.c-brown{background:var(--brown-soft);color:var(--brown);border-left-color:var(--brown)}
.cell .ev.c-blue{background:var(--blue-soft);color:var(--blue);border-left-color:var(--blue)}
.cell .ev.c-pink{background:#fbe6f0;color:#b8347a;border-left-color:#d64d97}
.cell .more{display:none}
.cell .ev.dragging{opacity:.4;cursor:grabbing}
.cell.over{background:var(--accent-soft);outline:2px dashed var(--accent);outline-offset:-2px}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:900px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bcol{background:#f0f3f6;border-radius:10px;padding:8px;min-height:80px}
.bcol h4{margin:0 0 8px;font-size:12.5px;display:flex;align-items:center;gap:6px}
.bcol h4 .cnt{color:var(--muted);font-weight:500}
.bcard{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;cursor:pointer;font-size:12.5px;transition:.12s}
.bcard:hover{border-color:#c9d6e2;box-shadow:var(--shadow)}
.bcard{cursor:grab}
.bcard.dragging{opacity:.4;cursor:grabbing}
.bcol.over{background:var(--accent-soft);outline:2px dashed var(--accent);outline-offset:-2px}
.bcard .t{font-weight:600;word-break:break-word}
.bcard.done .t{text-decoration:line-through;color:var(--muted);font-weight:500}
.bcard .m{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.bcard .n{color:var(--muted);font-size:11.5px;margin-top:3px;white-space:pre-wrap;word-break:break-all}
.bcard .n s{opacity:.6}
#view-cal.on{display:grid;grid-template-columns:1fr 1fr;gap:24px}
#view-cal.on .cal-section{grid-column:1;display:flex;flex-direction:column;gap:0}
#view-cal.on .list-section{grid-column:2;display:flex;flex-direction:column;gap:10px}
#view-cal.on .list-h:last-of-type{grid-column:1/-1}
#view-cal.on .panel{grid-column:1/-1}
.list-h{display:flex;align-items:center;gap:8px;margin:18px 0 10px;flex-wrap:wrap}
.list-h h3{margin:0;font-size:14px;color:var(--accent-ink)}
.list-h h3::before{content:"◽"}
.chip.q{background:var(--purple-soft);color:var(--purple)}
.chip.who{background:var(--brown-soft);color:var(--brown)}
.chip.st{background:var(--gray-soft);color:#3a4652}
.chip.st.c-red{background:var(--red-soft);color:var(--red)} .chip.st.c-orange{background:var(--orange-soft);color:var(--orange)}
.chip.st.c-yellow{background:var(--yellow-soft);color:#8a6f10} .chip.st.c-green{background:var(--green-soft);color:var(--green)}
.chip.st.c-purple{background:var(--purple-soft);color:var(--purple)} .chip.st.c-brown{background:var(--brown-soft);color:var(--brown)}
.chip.st.c-blue{background:var(--blue-soft);color:var(--blue)} .chip.st.c-pink{background:#fbe6f0;color:#b8347a}
.chip.st.c-gray{background:var(--gray-soft);color:var(--gray)}
.legend{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0 0}
.dlg .f .chk{display:inline-flex;align-items:center;gap:6px;font-weight:500;color:var(--text)}

/* hours table */
table.hours{width:100%;border-collapse:collapse;min-width:640px}
table.hours th{font-size:12px;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:#fafbfc;font-weight:600}
table.hours td{padding:7px 12px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13px}
table.hours tbody tr{cursor:pointer}
table.hours tbody tr:hover{background:#f6f9fc}
table.hours tr.done .nm{color:var(--muted);text-decoration:line-through}
table.hours .d{white-space:nowrap;color:var(--muted);width:70px}
table.hours .nm{word-break:break-word}
table.hours .q{white-space:nowrap;width:90px}
table.hours th.h,table.hours td.h{text-align:right;width:110px}
table.hours th.md,table.hours td.md{text-align:right;width:110px;color:var(--muted);white-space:nowrap}
table.hours td.h input{width:80px;border:1px solid var(--line);border-radius:6px;padding:4px 8px;text-align:right;background:#fff}
table.hours td.h input:focus{outline:2px solid var(--accent);border-color:transparent}
table.hours tfoot td{background:var(--accent-soft);color:var(--accent-ink);border-bottom:0;font-weight:700;padding:10px 12px}
table.hours tfoot td.md{color:var(--accent-ink)}
.chip.hrs{background:#e8f4ec;color:#2f7a4a}

/* modal */
.modal{position:fixed;background:#fff;display:none;flex-direction:column;z-index:50}
.modal.on{display:flex}
.modal.right{top:0;right:0;bottom:0;width:min(480px,90%);box-shadow:-2px 0 12px rgba(20,40,60,.15)}
.modal.center{top:50%;left:50%;transform:translate(-50%,-50%);width:min(600px,90%);max-height:90vh;border-radius:12px;box-shadow:0 8px 24px rgba(20,40,60,.25)}
.modal::before{content:'';position:fixed;z-index:-1}
.modal.right::before{inset:0;right:auto;width:calc(100vw - min(480px,90%));background:rgba(20,30,40,.3)}
.modal.center::before{inset:0;background:rgba(20,30,40,.5)}
.dlg{display:flex;flex-direction:column;height:100%;background:#fff}
.dlg h3{margin:0;padding:16px 20px;border-bottom:1px solid var(--line);font-size:15px;flex-shrink:0}
.dlg>div:not(h3):not(.foot){flex:1;overflow-y:auto;padding:20px}
.dlg .f{padding:6px 0}
.dlg .f label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
.dlg .f input[type=text],.dlg .f input[type=date],.dlg .f input[type=url],.dlg .f select,.dlg .f textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
.dlg .f textarea{min-height:90px;resize:vertical}
.dlg .f textarea.auto-height{min-height:60px;max-height:none;resize:none;overflow:hidden}
.dlg .f .input-with-hint{display:flex;align-items:center;gap:8px}
.dlg .f .input-with-hint input{flex:1}
.dlg .f .input-with-hint .hint{flex-shrink:0;white-space:nowrap}
.dlg .f .tagrow{display:flex;gap:10px;flex-wrap:wrap}
.dlg .f .tagrow label{display:inline-flex;align-items:center;gap:4px;font-weight:500;color:var(--text);margin:0}
.dlg .foot{display:flex;gap:6px;padding:14px 20px;border-top:1px solid var(--line);justify-content:flex-end;flex-shrink:0}
.dlg .foot .left{margin-right:auto}
.dlg .fs{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.opt-list{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.opt-list .chip{cursor:default}
.opt-list .chip button{border:0;background:transparent;padding:0;line-height:1;color:inherit;opacity:.6}
.opt-list .chip button:hover{opacity:1}

/* toast */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1f2933;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:60}
.toast.on{opacity:1}

/* stats */
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:120px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:20px;color:var(--accent-ink)}
.stat span{font-size:12px;color:var(--muted)}
.search{border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:220px;background:#fff}
mark{background:#fff3b0;padding:0 1px;border-radius:2px}
@media print{.top,.act,.ops,.month-foot,.filterbar{display:none!important}.month{break-inside:avoid}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <h1>🌊 더피프티원엑스 업무관리 <small id="todayLabel"></small></h1>
    <nav aria-label="화면 전환">
      <button class="on" data-view="dash">대시보드</button>
      <button data-view="cal">캘린더 & 리스트</button>
      <button data-view="journal">업무일지</button>
    </nav>
    <div class="spacer"></div>
    <div class="tools">
      <button class="btn" id="syncBtn" title="Supabase 로그인 / 동기화">⚪ <span>로그인 필요</span></button>
      <button class="btn" id="btnExport" title="현재 데이터를 JSON 파일로 저장">⬇ 내보내기</button>
      <button class="btn" id="btnImport" title="JSON 파일 불러오기">⬆ 가져오기</button>
      <input type="file" id="fileImport" accept="application/json" hidden>
      <button class="btn" id="btnOptions" title="상태·연관·태그 옵션 관리">⚙ 옵션</button>
    </div>
  </div>
</header>

<main>
<!-- ============ 대시보드 ============ -->
<section class="view on" id="view-dash">
  <div class="stats" id="stats"></div>
  <div class="grid">
    <div class="panel col-todo">
      <div class="panel-h"><h2>To do List</h2><span class="cnt" id="todoCnt"></span><span class="spacer"></span><button class="btn sm primary" id="addTodo">+ 추가</button></div>
      <div class="filterbar">
        <label><input type="checkbox" id="todoShowDone"> 완료 포함</label>
        <select id="todoFilterProject"><option value="">전체 프로젝트</option></select>
      </div>
      <div class="panel-b" id="todoList"></div>
    </div>

    <div class="panel col-projects">
      <div class="panel-h"><h2>Projects</h2><span class="cnt" id="projCnt"></span><span class="spacer"></span>
        <select id="projFilter" class="btn sm" style="font-weight:500"><option value="active">진행 중만</option><option value="all">전체</option><option value="done">완료/취소</option></select>
        <button class="btn sm primary" id="addProject">+ 추가</button></div>
      <div class="panel-b"><div class="cards" id="projList"></div></div>
    </div>

    <div class="panel col-note">
      <div class="panel-h"><h2>Note</h2><span class="spacer"></span><button class="btn sm primary" id="addNote">+ 추가</button></div>
      <div class="panel-b" id="noteList"></div>
    </div>
  </div>
</section>

<!-- ============ 캘린더 & 리스트 ============ -->
<section class="view" id="view-cal">
  <div class="cal-section">
    <div class="cal-h">
      <button class="btn sm" id="calPrev" aria-label="이전 달">◀</button>
      <h2 id="calTitle"></h2>
      <button class="btn sm" id="calNext" aria-label="다음 달">▶</button>
      <button class="btn sm ghost" id="calToday">오늘</button>
      <div class="seg" id="calDone">
        <button data-v="open" class="on">미완료</button><button data-v="done">완료</button><button data-v="all">전체</button>
      </div>
      <span style="flex:1"></span>
      <button class="btn primary" id="addCal">+ 일정 추가</button>
    </div>
    <input class="search" id="calSearch" type="search" placeholder="일정 검색 (DCBGIT 번호, 제목)" aria-label="일정 검색" style="width:100%;margin-bottom:12px">
    <div class="calendar"><div class="cal-grid" id="calGrid"></div></div>
  </div>
  <div class="list-section">
    <div class="list-h">
      <h3>TO DO LIST</h3>
      <span class="cnt" id="boardCnt" style="font-size:12px;color:var(--muted)"></span>
      <span style="flex:1"></span>
      <span class="chip q">4분면 시간 관리법</span>
      <label style="font-size:12px;color:var(--muted);display:inline-flex;gap:4px;align-items:center"><input type="checkbox" id="boardMonthOnly" checked> 이번 달 이후</label>
    </div>
    <div class="board" id="board"></div>
  </div>
  <div class="list-h">
    <h3>작업시간</h3>
    <span id="hoursCnt" style="font-size:12px;color:var(--muted)"></span>
    <span style="flex:1"></span>
    <span class="hint">표의 작업시간 칸에 바로 입력할 수 있습니다 (1시간 단위) · 1시간 = 0.125 MD</span>
  </div>
  <div class="panel" style="overflow-x:auto">
    <table class="hours" id="hoursTable">
      <thead><tr><th>마감일</th><th>업무 이름</th><th>4분면</th><th class="h">작업시간</th><th class="md">MD</th></tr></thead>
      <tbody id="hoursBody"></tbody>
      <tfoot><tr id="hoursTotal"></tr></tfoot>
    </table>
  </div>
</section>

<!-- ============ 업무일지 ============ -->
<section class="view" id="view-journal">
  <div class="journal-h">
    <h2>업무일지</h2>
    <input class="search" id="jSearch" type="search" placeholder="일지 검색 (예: DCBGIT-44099, 유플투쁠)" aria-label="일지 검색">
    <span class="spacer" style="flex:1"></span>
    <button class="btn" id="addToday">📅 오늘 일지 추가</button>
    <button class="btn" id="addMonth">+ 월 추가</button>
    <button class="btn ghost" id="toggleAll">모두 접기</button>
  </div>
  <div id="months"></div>
</section>
</main>

<!-- ============ 모달 ============ -->
<div id="overlay" class="overlay"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
  <div class="dlg">
    <h3 id="dlgTitle"></h3>
    <div id="dlgBody"></div>
    <div class="foot">
      <button class="btn danger left" id="dlgDelete" hidden>삭제</button>
      <button class="btn" id="dlgCancel">취소</button>
      <button class="btn primary" id="dlgSave">저장</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>

// Updated: 2026-09-29 — 실제 데이터는 Supabase 에 있습니다. 이 파일은 "옵션 기본값"과 빈 초기 상태만 가집니다.
// (프로젝트/할 일/메모/업무일지/캘린더 시드와 seed_helpers.js, months/*.js 는 DB 이전 후 삭제됨 — git 기록 참고)
const SEED = {
  version: 1,
  options: {
    related: ['LGU+', 'LG_Battery_Lifecare', '암웨이것모닝', '관련 업체 혹은 업무 종류 라벨링'],
    status: ['대기','보류','진행','검토','완료','취소','없음'],
    tags: ['중요','긴급'],
    designers: ['백은주책임님','유선우책임님','하나경책임님','손지민선임님','이하람수석님','도현진책임님','박하나차장님','전한비선임님','권지수선임님','이하영선임님','김채린선임님','이지선책임님'],
    calStatus: ['우선순위 1','우선순위 2','추후업무','분류대기','업무보류','제작완료','fixed','사업검수중','반영대기','반영완료'],
    quad: ['작업중','대기','반영대기','추후작업']
  },
  projects: [],
  todos: [],
  notes: [],
  months: [],
  cal: []
};

// ================== 저장소 ==================
const KEY = 'the51x-work-v1';
let DB;
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw){ DB = JSON.parse(raw); migrate(); return; } }catch(e){}
  DB = JSON.parse(JSON.stringify(SEED)); migrate();
  DB.updatedAt = '1970-01-01T00:00:00.000Z'; // 시드 상태 — 원격 데이터가 있으면 항상 원격 우선
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){}
}
function migrate(){
  // 누락된 필드/옵션 기본값 보충 (데이터 자체는 Supabase 에서 옴)
  ['projects','todos','notes','months','cal'].forEach(k=>{ if(!Array.isArray(DB[k])) DB[k] = []; });
  if(!DB.options) DB.options = {};
  ['related','status','tags','calStatus','quad','designers'].forEach(k=>{ if(!DB.options[k]) DB.options[k] = [...SEED.options[k]]; });
  DB.options.quad = [...QUADS];
  DB.cal.forEach(c=>{ if(QUAD_MIGRATE[c.quad]) c.quad = QUAD_MIGRATE[c.quad]; });
}
function save(show=true){
  DB.updatedAt = new Date().toISOString();
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){ toast('저장 실패: 브라우저 저장공간을 확인하세요'); }
  render();
  if(show) toast('저장됨');
  schedulePush();
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ================== 날짜 유틸 ==================
const DOW = ['일','월','화','수','목','금','토'];
const todayStr = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
function dow(dateStr){ if(!dateStr) return ''; const [y,m,d]=dateStr.split('-').map(Number); return DOW[new Date(y,m-1,d).getDay()]; }
function daysLeft(dateStr){ if(!dateStr) return null; const [y,m,d]=dateStr.split('-').map(Number); const t=new Date(); t.setHours(0,0,0,0); return Math.round((new Date(y,m-1,d)-t)/86400000); }
function dueChip(dateStr, done){
  if(!dateStr) return '';
  const n = daysLeft(dateStr);
  if(done) return `<span class="chip due">${dateStr}</span>`;
  const label = n===0 ? 'D-Day' : n>0 ? `D-${n}` : `D+${-n}`;
  return `<span class="chip due ${n===0?'today':n<0?'over':''}" title="${dateStr}">${label} · ${dateStr.slice(5)} (${dow(dateStr)})</span>`;
}
const isDone = s => ['완료','취소','없음'].includes(s);

// ================== 렌더 ==================
function render(){
  document.getElementById('todayLabel').textContent = `${todayStr()} (${dow(todayStr())})`;
  renderStats(); renderTodos(); renderProjects(); renderNotes(); renderMonths(); renderCal();
}
function renderStats(){
  const openT = DB.todos.filter(t=>!isDone(t.status)).length;
  const over = DB.todos.filter(t=>!isDone(t.status) && t.date && daysLeft(t.date)<0).length;
  const proj = DB.projects.filter(p=>!isDone(p.status)).length;
  const mk = todayStr().slice(0,7); const m = DB.months.find(x=>x.key===mk);
  const logs = m ? m.entries.filter(e=>e.log.trim()).length : 0;
  document.getElementById('stats').innerHTML =
    `<div class="stat"><b>${openT}</b><span>진행 중 할 일</span></div>`+
    `<div class="stat"><b style="color:${over?'var(--red)':'var(--accent-ink)'}">${over}</b><span>기한 지남</span></div>`+
    `<div class="stat"><b>${proj}</b><span>진행 중 프로젝트</span></div>`+
    `<div class="stat"><b>${logs}</b><span>이번 달 일지 작성일</span></div>`+
    `<div class="stat"><b>${DB.cal.filter(c=>!c.done && c.start && c.start.slice(0,7)===mk).length}</b><span>이번 달 미완료 일정</span></div>`;
}
function todoHTML(t, compact=false){
  const p = DB.projects.find(p=>p.id===t.project);
  const done = isDone(t.status);
  return `<div class="todo ${done?'done':''}" data-id="${t.id}">
    <input type="checkbox" class="chk" ${t.status==='완료'?'checked':''} aria-label="완료 처리" data-act="toggle">
    <div class="body">
      <div class="name" data-act="edit" title="클릭하여 수정">${esc(t.name)}</div>
      <div class="meta">
        <span class="chip s-${esc(t.status)}">${esc(t.status)}</span>
        ${(t.tags||[]).map(x=>`<span class="chip t-${esc(x)}">${esc(x)}</span>`).join('')}
        ${t.designer ? `<span class="chip designer">[${esc(t.designer)}]</span>` : ''}
        ${t.rms ? `<a href="${esc(t.rms)}" class="chip rms" target="_blank">[RMS]</a>` : ''}
        ${dueChip(t.date, done)}
        ${(!compact && p) ? `<span class="chip rel">${esc(p.name)}</span>` : ''}
      </div>
    </div>
    <button class="btn sm ghost act" data-act="edit" aria-label="수정">✎</button>
  </div>`;
}
function renderTodos(){
  const showDone = document.getElementById('todoShowDone').checked;
  const pf = document.getElementById('todoFilterProject');
  const cur = pf.value;
  pf.innerHTML = '<option value="">전체 프로젝트</option>' + DB.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
  pf.value = cur;
  const order = s => ({'대기':0,'진행':1,'검토':2,'보류':3,'완료':4,'없음':5,'취소':6}[s] ?? 9);
  let list = DB.todos.filter(t => (showDone || !isDone(t.status)) && (!cur || t.project===cur));
  list.sort((a,b)=> order(a.status)-order(b.status) || (b.tags||[]).length-(a.tags||[]).length || (a.date||'9').localeCompare(b.date||'9'));
  document.getElementById('todoCnt').textContent = `${list.length}건`;
  document.getElementById('todoList').innerHTML = list.length ? list.map(t=>todoHTML(t)).join('') : '<div class="empty">할 일이 없습니다 🎉</div>';
}
function renderProjects(){
  const f = document.getElementById('projFilter').value;
  let list = DB.projects.filter(p => f==='all' || (f==='active' ? !isDone(p.status) : isDone(p.status)));
  document.getElementById('projCnt').textContent = `${list.length}건`;
  document.getElementById('projList').innerHTML = list.length ? list.map(p=>{
    const subs = DB.todos.filter(t=>t.project===p.id);
    const done = subs.filter(t=>t.status==='완료').length;
    const pct = subs.length ? Math.round(done/subs.length*100) : 0;
    const left = daysLeft(p.date);
    return `<div class="card st-${esc(p.status)}" data-id="${p.id}">
      <div class="title" data-act="edit" title="클릭하여 수정">${esc(p.name)}</div>
      <div class="row"><span class="chip s-${esc(p.status)}">${esc(p.status)}</span>${p.related?`<span class="chip rel">${esc(p.related)}</span>`:''}${p.date?`<span class="chip due ${!isDone(p.status)&&left===0?'today':''}">${p.date}${!isDone(p.status)&&left!==null&&left>=0?` · D-${left}`:''}</span>`:''}</div>
      ${p.memo?`<div class="memo">${esc(p.memo)}</div>`:''}
      ${subs.length?`<div class="pct"><span>완료율</span><span>${done}/${subs.length} · ${pct}%</span></div><div class="bar"><i style="width:${pct}%"></i></div>
        <div class="sub">${subs.map(t=>todoHTML(t,true)).join('')}</div>`:''}
      <div class="row"><button class="btn sm ghost" data-act="addsub">+ 할 일</button></div>
      <div class="act"><button class="btn sm ghost" data-act="edit" aria-label="수정">✎</button></div>
    </div>`;
  }).join('') : '<div class="empty" style="grid-column:1/-1">프로젝트가 없습니다</div>';
}
function renderNotes(){
  document.getElementById('noteList').innerHTML = DB.notes.length ? DB.notes.map(n=>`<div class="note" data-id="${n.id}">
    <h3>${esc(n.title)}</h3><pre>${esc(n.body)}</pre>
    <div class="act"><button class="btn sm ghost" data-act="edit" aria-label="수정">✎</button></div></div>`).join('') : '<div class="empty">메모가 없습니다</div>';
}
let openMonths = null;
function fmtLog(s, q){
  let h = esc(s)
    .replace(/\[([A-Z]+-[\d,\/ A-Z-]+)\]/g,'<span class="tk">[$1]</span>')
    .replace(/^(→|&gt;)/gm,'<span class="arrow">$1</span>');
  if(q){ const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'); h = h.replace(re, m=>`<mark>${m}</mark>`); }
  return h;
}
function renderMonths(){
  const q = document.getElementById('jSearch').value.trim();
  const box = document.getElementById('months');
  if(openMonths===null){ openMonths = new Set([todayStr().slice(0,7)]); }
  const months = [...DB.months].sort((a,b)=>b.key.localeCompare(a.key));
  const t = todayStr();
  box.innerHTML = months.map(m=>{
    let entries = [...m.entries].sort((a,b)=>a.date.localeCompare(b.date));
    if(q) entries = entries.filter(e=> (e.log+e.memo).toLowerCase().includes(q.toLowerCase()));
    if(q && !entries.length) return '';
    const open = q || openMonths.has(m.key);
    return `<details class="month" data-key="${m.key}" ${open?'open':''}>
      <summary>${m.key.replace('-','.')}<span class="cnt">${entries.length}일 기록</span><span class="spacer"></span><button class="btn sm ghost" data-act="delmonth" aria-label="월 삭제">🗑</button></summary>
      <div class="tbl"><table class="j"><thead><tr><th>날짜</th><th>일지</th><th>비고</th><th></th></tr></thead><tbody>
      ${entries.map(e=>`<tr class="${e.date===t?'today':''} ${!e.log.trim()&&e.memo.trim()?'off':''}" data-id="${e.id}">
        <td class="d">${e.date.slice(5).replace('-','.')} <span class="chip dow">${dow(e.date)}</span><small>${e.date}</small></td>
        <td class="log" contenteditable="plaintext-only" data-f="log" spellcheck="false">${fmtLog(e.log,q)}</td>
        <td class="memo" contenteditable="plaintext-only" data-f="memo" spellcheck="false">${fmtLog(e.memo,q)}</td>
        <td class="ops"><button class="btn sm ghost" data-act="delentry" aria-label="삭제">🗑</button></td></tr>`).join('') || `<tr><td colspan="4" class="empty">기록이 없습니다</td></tr>`}
      </tbody></table></div>
      <div class="month-foot"><input type="date" class="btn sm" data-f="newdate" value="${m.key===t.slice(0,7)?t:m.key+'-01'}" style="font-weight:500"><button class="btn sm primary" data-act="addentry">+ 날짜 추가</button><span class="hint">일지·비고 칸을 클릭해 바로 입력하고, 칸 밖을 클릭하면 자동 저장됩니다.</span></div>
    </details>`;
  }).join('') || '<div class="empty">월을 추가해 일지를 시작하세요</div>';
}

// ================== 모달 ==================
const modal = document.getElementById('modal');
let dlg = null; // {onSave, onDelete}
function openDialog(title, bodyHTML, onSave, onDelete, position='right'){
  document.getElementById('dlgTitle').textContent = title;
  document.getElementById('dlgBody').innerHTML = bodyHTML;
  const del = document.getElementById('dlgDelete'); del.hidden = !onDelete;
  dlg = {onSave, onDelete};
  modal.classList.toggle('center', position==='center');
  modal.classList.toggle('right', position!=='center');
  modal.classList.add('on');
  if(position==='center') document.getElementById('overlay').classList.add('on');
  const first = modal.querySelector('input,textarea,select'); if(first) first.focus();
  setupAutoHeight();
}
function setupAutoHeight(){
  const textareas = document.querySelectorAll('textarea.auto-height');
  textareas.forEach(ta => {
    const adjust = () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; };
    adjust();
    ta.addEventListener('input', adjust);
  });
}
function closeDialog(shouldSave=true){
  if(shouldSave && dlg && dlg.onSave){
    if(dlg.onSave()===false) return;
  }
  modal.classList.remove('on');
  document.getElementById('overlay').classList.remove('on');
  dlg=null;
}
document.getElementById('dlgCancel').onclick = ()=>closeDialog(false);
document.getElementById('dlgSave').onclick = ()=>closeDialog(true);
document.getElementById('dlgDelete').onclick = ()=>{ if(dlg && dlg.onDelete && confirm('삭제할까요?')){ dlg.onDelete(); closeDialog(false); } };
modal.addEventListener('click', e=>{ if(e.target===modal) closeDialog(true); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && modal.classList.contains('on')) closeDialog(true); });
const $v = id => document.getElementById(id).value.trim();
const optHTML = (arr, sel) => (arr||[]).map(o=>`<option ${o===sel?'selected':''}>${esc(o)}</option>`).join('');

function todoDialog(t){
  const isNew = !t; t = t || {name:'',tags:[],date:'',status:'대기',project:'',designer:'',rms:''};
  openDialog(isNew?'할 일 추가':'할 일 수정', `
    <div class="f"><label for="f_name">이름</label><textarea id="f_name" rows="2">${esc(t.name)}</textarea></div>
    <div class="fs"><div class="f"><label for="f_status">상태</label><select id="f_status">${optHTML(DB.options.status,t.status)}</select></div>
    <div class="f"><label for="f_date">일자</label><input type="date" id="f_date" value="${t.date||''}"></div></div>

  if(!date) return;
  const m = ensureMonth(date.slice(0,7));
  let e = m.entries.find(x=>x.date===date);
  if(!e){ e={id:uid(), date, log:'', memo:''}; m.entries.push(e); openMonths.add(m.key); save(); toast(`${date} 추가됨`); }
  else { openMonths.add(m.key); render(); toast('이미 있는 날짜입니다'); }

}

const STATUS_COLOR = {'우선순위 1':'red','우선순위 2':'orange','추후업무':'yellow','분류대기':'gray','업무보류':'gray','회의':'purple','제작완료':'blue','컨펌전':'brown','fixed':'pink','사업검수중':'green','반영대기':'purple','반영완료':'yellow'};

function calFilter(list){
  const q = document.getElementById('calSearch').value.trim().toLowerCase();
  return list.filter(c => (calDoneMode==='all' || (calDoneMode==='done') === !!c.done) && (!q || (c.name+' '+(c.notes||[]).join(' ')).toLowerCase().includes(q)));

function inRange(c, d){ if(!c.start) return false; const e = c.end || c.start; return c.start <= d && d <= e; }
function renderCal(){
  const [y,m] = calYM.split('-').map(Number);
  document.getElementById('calTitle').textContent = `${y}.${String(m).padStart(2,'0')}`;
  const first = new Date(y, m-1, 1); const startDow = first.getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const t = todayStr();
  const items = calFilter(DB.cal);
  let html = DOW.map(d=>`<div class="dh">${d}</div>`).join('');
  const total = Math.ceil((startDow + daysInMonth)/7)*7;
  for(let i=0;i<total;i++){
    const dayNum = i - startDow + 1;
    const d = new Date(y, m-1, dayNum);
    const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const other = dayNum<1 || dayNum>daysInMonth;
    const evs = items.filter(c=>inRange(c, ds)).sort((a,b)=>(a.status||'~').localeCompare(b.status||'~'));
    html += `<div class="cell ${other?'other':''} ${ds===t?'today':''} ${d.getDay()===0?'sun':d.getDay()===6?'sat':''}" data-date="${ds}">
      <span class="dn">${d.getDate()}</span>
      ${evs.map(c=>`<span class="ev ${c.done?'done':''} ${c.status?'c-'+stColor(c.status):'off'}" data-id="${c.id}" draggable="true" title="${esc(c.name)}${c.status?' · '+esc(c.status):''}">${c.time?'<b>'+esc(c.time)+'</b> ':''}${esc(c.name)}</span>`).join('')}
    </div>`;
  }
  document.getElementById('calGrid').innerHTML = html;
  renderBoard(items);
}
function renderBoard(items){
  const monthOnly = document.getElementById('boardMonthOnly').checked;
  let list = items.filter(c => !monthOnly || (c.start && c.start.slice(0,7)>=calYM));
  const key = 'quad';
  const groups = {}; QUADS.forEach(q=>groups[q]=[]);
  list.forEach(c=>{ const g = c.quad; if(groups[g]) groups[g].push(c); });
  const keys = QUADS;
  document.getElementById('boardCnt').textContent = `${keys.reduce((n,k)=>n+groups[k].length,0)}건`;
  renderHours(list);
  document.getElementById('board').innerHTML = keys.map(g=>`<div class="bcol" data-group="${esc(g)}"><h4><span class="chip q">${esc(g)}</span><span class="cnt">${groups[g].length}</span></h4>

      <div class="t">${esc(c.name)}</div>
      <div class="m">${c.start?`<span class="chip due">${c.start.slice(5).replace('-','.')}${c.end?'~'+c.end.slice(5).replace('-','.'):''}</span>`:''}${c.time?`<span class="chip due">${esc(c.time)}</span>`:''}${c.hours!=null?`<span class="chip hrs">⏱ ${fmtH(c.hours)}</span>`:''}${c.status?`<span class="chip st c-${stColor(c.status)}">${esc(c.status)}</span>`:''}${c.designer?`<span class="chip designer">[${esc(c.designer)}]</span>`:''}${c.rms?`<a href="${esc(c.rms)}" class="chip rms" target="_blank">[RMS]</a>`:''}</div>
    </div>`).join('') || '<div class="empty" style="padding:14px 6px">비어 있음</div>'}</div>`).join('');
}
const fmtH = h => Math.round(h).toLocaleString('ko-KR') + 'h';
const fmtMD = h => (Math.round(h*0.125*1000)/1000).toLocaleString('ko-KR');
function renderHours(list){
  const rows = list.filter(c=>c.quad && QUADS.includes(c.quad)).sort((a,b)=>(a.start||'9').localeCompare(b.start||'9'));
  const total = rows.reduce((n,c)=>n+(c.hours||0),0);

}

function toRows(db){
  const r = {};
  r.options = Object.entries(db.options||{}).map(([key,values])=>({key, values}));
  r.options.push({key:'_months', values:(db.months||[]).map(m=>m.key).sort()}); // 빈 달도 보존
  r.projects = (db.projects||[]).map(p=>({id:p.id, name:p.name||'', related:p.related||'', status:p.status||'', date:nz(p.date), memo:p.memo||''}));
  r.todos = (db.todos||[]).map(t=>({id:t.id, name:t.name||'', tags:t.tags||[], date:nz(t.date), status:t.status||'', project_id:t.project||'', designer:t.designer||'', rms:t.rms||''}));
  r.notes = (db.notes||[]).map(n=>({id:n.id, title:n.title||'', body:n.body||''}));
  r.work_logs = (db.months||[]).flatMap(m=>(m.entries||[]).map(e=>({id:e.id, month_key:m.key, date:nz(e.date), log:e.log||'', memo:e.memo||''})));
  r.calendar_items = (db.cal||[]).map(c=>({id:c.id, nid:c.nid??null, name:c.name||'', start_date:nz(c.start), end_date:nz(c.end), status:c.status||'', quad:c.quad||'', done:!!c.done, time:c.time||'', hours:c.hours??null, designer:c.designer||'', rms:c.rms||'', who:c.who||[], notes:c.notes||[]}));
  return r;
}
// 옛 id(p1, t5, c17, d0901)는 숫자순, 새로 만든 id(uid)는 그 뒤에 생성순
const idRank = id => { const m=/^[a-z]{1,2}(\d{1,5})$/.exec(id); return m ? [0,+m[1],''] : [1,0,id]; };
const byId = (a,b) => { const x=idRank(a.id), y=idRank(b.id); return (x[0]-y[0]) || (x[1]-y[1]) || (x[2]<y[2]?-1:x[2]>y[2]?1:0); };
function fromRows(R){
  const options = {}; let monthKeys = [];
  R.options.forEach(o=>{ if(o.key==='_months') monthKeys=o.values||[]; else options[o.key]=o.values; });
  const by = {};
  R.work_logs.forEach(w=>{ (by[w.month_key]=by[w.month_key]||[]).push({id:w.id, date:ds(w.date), log:w.log, memo:w.memo}); });
  monthKeys.forEach(k=>{ if(!by[k]) by[k]=[]; });
  const months = Object.keys(by).sort().map(key=>({key, entries:by[key].sort((a,b)=>a.date.localeCompare(b.date)||byId(a,b))}));
  return {
    version:1, options,
    projects: R.projects.slice().sort(byId).map(p=>({id:p.id, name:p.name, related:p.related, status:p.status, date:ds(p.date), memo:p.memo})),
    todos: R.todos.slice().sort(byId).map(t=>({id:t.id, name:t.name, tags:t.tags||[], date:ds(t.date), status:t.status, project:t.project_id, designer:t.designer, rms:t.rms})),
    notes: R.notes.slice().sort(byId).map(n=>({id:n.id, title:n.title, body:n.body})),
    months,
    cal: R.calendar_items.slice().sort(byId).map(c=>({id:c.id, nid:c.nid, name:c.name, start:ds(c.start_date), end:ds(c.end_date), status:c.status, quad:c.quad, done:!!c.done, time:c.time, hours:c.hours, designer:c.designer, rms:c.rms, who:c.who||[], notes:c.notes||[]})),
    updatedAt: new Date().toISOString()
  };
}
function snapshotOf(rows){ const s={}; SB_TABLES.forEach(t=>{ const pk=SB_PK[t]||'id'; s[t]={}; rows[t].forEach(r=>{ s[t][r[pk]]=JSON.stringify(r); }); }); return s; }
const getSnap = () => { try{ return JSON.parse(localStorage.getItem(SB_SNAP_KEY)||'null'); }catch(e){ return null; } };
const setSnap = s => { try{ localStorage.setItem(SB_SNAP_KEY, JSON.stringify(s)); }catch(e){} };
const setDirtyFlag = on => { try{ on ? localStorage.setItem(SB_DIRTY_KEY,'1') : localStorage.removeItem(SB_DIRTY_KEY); }catch(e){} };
const isDirtyFlag = () => { try{ return localStorage.getItem(SB_DIRTY_KEY)==='1'; }catch(e){ return false; } };

// ---- 인증 / REST ----
let syncState = { status:'off', msg:'', timer:null, pending:false, pushing:false, dirty:false, pulling:false, lastPull:0 };
function sbSession(){ try{ return JSON.parse(localStorage.getItem(SB_SESSION_KEY)||'null'); }catch(e){ return null; } }
function sbSetSession(s){ try{ s ? localStorage.setItem(SB_SESSION_KEY, JSON.stringify(s)) : localStorage.removeItem(SB_SESSION_KEY); }catch(e){} }
async function sbAuth(grant, body){
  const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=${grant}`, {method:'POST', headers:{apikey:SB_ANON_KEY,'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const d = await r.json().catch(()=>({}));
  if(!r.ok){ const e=new Error(d.msg||d.error_description||d.message||('HTTP '+r.status)); e.status=r.status; throw e; }
  const s = { access_token:d.access_token, refresh_token:d.refresh_token, expires_at:Math.floor(Date.now()/1000)+(d.expires_in||3600), email:(d.user&&d.user.email)||(sbSession()||{}).email||'' };
  sbSetSession(s); return s;
}
async function sbToken(){
  let s = sbSession(); if(!s) throw new Error('로그인이 필요합니다');
  if(s.expires_at - 60 < Date.now()/1000){
    try{ s = await sbAuth('refresh_token', {refresh_token:s.refresh_token}); }
    catch(e){ if(e.status===400||e.status===401){ sbSetSession(null); setSync('off'); throw new Error('로그인이 만료되었습니다. 다시 로그인하세요'); } throw e; }
  }
  return s.access_token;
}
async function sbRest(path, {method='GET', body=null, headers={}}={}){
  const token = await sbToken();
  const r = await fetch(`${SB_URL}/rest/v1/${path}`, {method, headers:{apikey:SB_ANON_KEY, Authorization:'Bearer '+token, ...(body?{'Content-Type':'application/json'}:{}), ...headers}, body:body?JSON.stringify(body):null});
  if(!r.ok){ const d=await r.json().catch(()=>({})); throw new Error(d.message||('HTTP '+r.status)); }
  return r.status===204 ? null : r.json().catch(()=>null);
}
async function sbSelectAll(table){
  const out = [];
  for(let from=0;;from+=1000){
    const page = await sbRest(`${table}?select=*&order=${SB_PK[table]||'id'}`, {headers:{'Range-Unit':'items', Range:`${from}-${from+999}`}});
    out.push(...page); if(page.length<1000) break;
  }
  return out;
}

// ---- 상태 표시 ----
function setSync(status, msg){ syncState.status=status; syncState.msg=msg||''; const el=document.getElementById('syncBtn'); if(!el) return;
  const map={off:['⚪','로그인 필요'], ok:['🟢','동기화됨'], busy:['🟡','동기화 중…'], err:['🔴','동기화 오류']};
  const [dot,label]=map[status]||map.off; el.innerHTML=`${dot} <span>${label}</span>`; el.title = msg || label; }

// ---- 불러오기 ----
async function pullRemote(silent=false){
  if(!sbSession()){ setSync('off'); return false; }
  if(syncState.pulling || syncState.pushing) return false;
  try{
    // 서버에 못 올린 변경이 있으면 먼저 올린 뒤 불러옴(스냅샷이 있을 때만)
    if(getSnap() && (isDirtyFlag() || syncState.pending)){ await pushRemote(); if(isDirtyFlag()) return false; }
    syncState.pulling = true; setSync('busy');
    const R = {}; for(const t of SB_TABLES) R[t] = await sbSelectAll(t);
    const remote = fromRows(R);
    const remoteSnap = snapshotOf(toRows(remote));
    // 최초 1회: 이 브라우저에 이전 시점(9/8) 이후 수정한 내용이 있으면 덮어쓰기 전에 물어봄
    if(!getSnap() && (DB.updatedAt||'') > SB_MIGRATED_AT){
      if(confirm('이 브라우저에 Supabase로 옮긴 데이터(9/8 기준)보다 최신 수정 내용이 있습니다.\n\n[확인] 이 브라우저의 데이터를 Supabase에 올립니다\n[취소] Supabase 데이터를 사용합니다 (이 브라우저 데이터는 백업 파일로 먼저 내려받습니다)')){
        setSnap(remoteSnap); syncState.pulling=false; syncState.lastPull=Date.now(); setDirtyFlag(true); await pushRemote(); return true;
      }
      document.getElementById('btnExport').click();
    }
    DB = remote; setSnap(remoteSnap);
    migrate();
    try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(_){}
    openMonths = null; render();
    syncState.lastPull = Date.now(); setDirtyFlag(false);
    setSync('ok', `마지막 동기화 ${new Date().toLocaleTimeString('ko-KR')}`);
    if(!silent) toast('Supabase에서 불러왔습니다');
    // migrate() 가 채운 기본값 등 서버와 다른 부분이 있으면 올림
    const now = snapshotOf(toRows(DB)); if(JSON.stringify(now)!==JSON.stringify(remoteSnap)) schedulePush();
    return true;
  }catch(e){ setSync('err', String(e.message)); if(!silent) toast('불러오기 실패: '+e.message); return false; }
  finally{ syncState.pulling = false; }
}

// ---- 저장(바뀐 행만) ----
async function pushRemote(){
  if(!sbSession() || !getSnap()) return false;   // 스냅샷 없음 = 아직 한 번도 불러오지 않음 → 덮어쓰기 방지
  if(syncState.pushing || syncState.pulling){ syncState.dirty=true; return false; }
  syncState.pushing = true; syncState.pending = false; setSync('busy');
  let ok = true;
  try{
    const rows = toRows(DB), snap = getSnap();
    for(const t of SB_TABLES){
      const pk = SB_PK[t]||'id', cur = {};
      rows[t].forEach(r=>{ cur[r[pk]] = JSON.stringify(r); });
      const old = snap[t]||{};
      const changed = rows[t].filter(r=>old[r[pk]]!==cur[r[pk]]);
      const removed = Object.keys(old).filter(k=>!(k in cur));
      const oldN = Object.keys(old).length;
      if(removed.length>20 && removed.length>oldN/2 && !confirm(`${t}: ${oldN}건 중 ${removed.length}건을 Supabase에서 삭제합니다. 계속할까요?`)) throw new Error('대량 삭제가 취소되었습니다');
      for(let i=0;i<changed.length;i+=200)
        await sbRest(`${t}?on_conflict=user_id,${pk}`, {method:'POST', body:changed.slice(i,i+200), headers:{Prefer:'resolution=merge-duplicates,return=minimal'}});
      for(let i=0;i<removed.length;i+=50){
        const list = removed.slice(i,i+50).map(k=>`"${k.replace(/\\/g,'\\\\').replace(/"/g,'\\"')}"`).join(',');
        await sbRest(`${t}?${pk}=in.${encodeURIComponent('('+list+')')}`, {method:'DELETE'});
      }
      snap[t] = cur; setSnap(snap);
    }
    setSync('ok', `마지막 동기화 ${new Date().toLocaleTimeString('ko-KR')}`);
  }catch(e){ ok=false; setSync('err', String(e.message)); toast('Supabase 저장 실패: '+e.message); }
  finally{
    syncState.pushing = false;
    if(syncState.dirty){ syncState.dirty=false; pushRemote(); }
    else if(ok && !syncState.pending) setDirtyFlag(false);
  }
  return ok;
}
function schedulePush(){
  setDirtyFlag(true);
  if(!sbSession()){ setSync('off','로그인하면 다른 기기와 동기화됩니다 (지금은 이 브라우저에만 저장)'); return; }
  syncState.pending = true; clearTimeout(syncState.timer); setSync('busy'); syncState.timer = setTimeout(pushRemote, 1000);
}
window.addEventListener('beforeunload', e=>{ if(syncState.pending || syncState.pushing){ e.preventDefault(); e.returnValue=''; } });
// 다른 기기에서 수정했을 수 있으니, 탭으로 돌아올 때 최신 데이터 확인
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState!=='visible' || !sbSession()) return;
  if(Date.now()-syncState.lastPull<30000 || syncState.pushing || syncState.pending || modal.classList.contains('on')) return;
  pullRemote(true);
});

// ---- 로그인 / 동기화 창 ----
function syncDialog(){
  const s = sbSession();
  const msg = t => { const el=document.getElementById('s_msg'); if(el) el.textContent=t; };
  if(s){
    openDialog('Supabase 동기화', `
      <div class="f hint" style="padding-top:10px">로그인: <b>${esc(s.email||'')}</b><br>수정하면 1초 뒤 바뀐 항목만 저장되고, 다른 기기에서 수정한 내용은 이 탭으로 돌아올 때 자동으로 불러옵니다.</div>
      <div class="f" style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm" id="s_pull" type="button">⬇ 지금 불러오기</button><button class="btn sm" id="s_push" type="button">⬆ 지금 저장</button><button class="btn sm" id="s_out" type="button">로그아웃</button><span id="s_msg" class="hint" style="align-self:center"></span></div>`, null);
    document.getElementById('s_pull').onclick = async ()=>{ msg('불러오는 중…'); msg((await pullRemote())?'불러오기 완료':'실패: '+syncState.msg); };
    document.getElementById('s_push').onclick = async ()=>{ msg('저장 중…'); msg((await pushRemote())?'저장 완료':'실패: '+syncState.msg); };
    document.getElementById('s_out').onclick = ()=>{ if(isDirtyFlag() && !confirm('아직 서버에 저장되지 않은 변경이 있습니다. 그래도 로그아웃할까요?')) return; sbSetSession(null); setSync('off'); closeDialog(false); toast('로그아웃했습니다'); };
    return;
  }
  openDialog('Supabase 로그인', `
    <div class="f hint" style="padding-top:10px">Supabase에 만든 계정으로 로그인하면 데이터가 서버에 저장되고 어느 기기에서 열어도 같은 데이터를 봅니다.</div>
    <div class="f"><label for="s_email">이메일</label><input type="email" id="s_email" autocomplete="username"></div>
    <div class="f"><label for="s_pw">비밀번호</label><input type="password" id="s_pw" autocomplete="current-password"></div>
    <div class="f"><span id="s_msg" class="hint"></span></div>`,
    ()=>{
      const email=$v('s_email'), pw=document.getElementById('s_pw').value;
      if(!email||!pw){ msg('이메일과 비밀번호를 입력하세요'); return false; }
      msg('로그인 중…');
      sbAuth('password',{email, password:pw}).then(()=>{ closeDialog(false); return pullRemote(); }).catch(e=>msg('로그인 실패: '+e.message));
      return false;
    });
}
document.getElementById('syncBtn').onclick = syncDialog;

// 시작
load();
try{ const v=localStorage.getItem(KEY+':view'); if(v){ const b=document.querySelector(`[data-view=${v}]`); if(b) b.click(); } }catch(e){}
render();
setSync(sbSession()?'busy':'off');
if(sbSession()) pullRemote(true);
</script>
</body>
</html>
